<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060809"/>
      <stop offset="100%" stop-color="#0E1117"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="720" height="200" fill="url(#bg)"/>
  <rect width="720" height="200" fill="url(#glow)"/>
  <rect x="0" y="0" width="720" height="2" fill="#22D3EE"/>
  <text x="40" y="52" font-family="system-ui,-apple-system,sans-serif" font-size="26" font-weight="700" fill="#F1F3F6" letter-spacing="-0.5">GitHub Ranking Audit</text>
  <text x="40" y="80" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#737E8E">Audit your repository's search ranking signals in one command</text>
  <text x="40" y="112" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#B8C0CC">Name score · Description · Topics · README · Stars · Activity · Overall grade</text>
  <g opacity="0.3" transform="translate(420,90)">
    <rect x="0" y="0" width="260" height="90" rx="6" fill="#0E1117" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="12" y="20" font-family="monospace" font-size="10" fill="#737E8E">$ python ranking_audit.py owner/repo</text>
    <text x="12" y="36" font-family="monospace" font-size="10" fill="#22D3EE">name</text>
    <text x="60" y="36" font-family="monospace" font-size="10" fill="#4ADE80">92/100</text>
    <text x="110" y="36" font-family="monospace" font-size="10" fill="#34D399">[##################..]</text>
    <text x="12" y="50" font-family="monospace" font-size="10" fill="#22D3EE">stars</text>
    <text x="60" y="50" font-family="monospace" font-size="10" fill="#F97316">70/100</text>
    <text x="110" y="50" font-family="monospace" font-size="10" fill="#F97316">[##############......]</text>
    <text x="12" y="64" font-family="monospace" font-size="10" fill="#22D3EE">topics</text>
    <text x="60" y="64" font-family="monospace" font-size="10" fill="#4ADE80">100/100</text>
    <text x="110" y="64" font-family="monospace" font-size="10" fill="#34D399">[####################]</text>
    <text x="12" y="80" font-family="monospace" font-size="10" fill="#F1F3F6" font-weight="700">Overall: 85/100 (A)</text>
  </g>
  <rect x="40" y="150" width="90" height="26" rx="6" fill="none" stroke="#22D3EE" stroke-opacity="0.3" stroke-width="1"/>
  <text x="85" y="167" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#22D3EE" text-anchor="middle">Python 3.8+</text>
  <rect x="142" y="150" width="60" height="26" rx="6" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="172" y="167" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#B8C0CC" text-anchor="middle">MIT</text>
  <rect x="214" y="150" width="90" height="26" rx="6" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="259" y="167" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#B8C0CC" text-anchor="middle">Zero config</text>
  <rect x="316" y="150" width="110" height="26" rx="6" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="371" y="167" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#4ADE80" text-anchor="middle">buygithub.com</text>
  <rect x="0" y="198" width="720" height="2" fill="#22D3EE" opacity="0.3"/>
</svg>
